name: Updater regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows players run whatever Python they installed; 3.9 is also the
          # macOS Command Line Tools Python.
          - {os: windows-latest, python: '3.9'}
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
          # Runs the macOS entry script itself (bash, /var -> /private/var temp paths).
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run temporary-client and localhost-service tests
        run: python -m unittest discover -s tests -v
